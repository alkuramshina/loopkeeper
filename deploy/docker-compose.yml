services:
  postgres:
    image: postgres:17
    container_name: loopkeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loopkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopkeeper}
      POSTGRES_DB: ${POSTGRES_DB:-loopkeeper}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres-test:
    image: postgres:17
    container_name: loopkeeper-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loopkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopkeeper}
      POSTGRES_DB: loopkeeper_test
    ports:
      - "${TEST_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: loopkeeper-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: server
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: loopkeeper-root
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loopkeeper-root-dev-secret}
    command: server /data --console-address :9001
    ports: ['9000:9000', '9001:9001']
    volumes: [minio_data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: loopkeeper-mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: client
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: loopkeeper-root
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loopkeeper-root-dev-secret}
      MINIO_BUCKET: loopkeeper
      MINIO_APP_USER: loopkeeper-app
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:-loopkeeper-app-dev-secret}
    volumes: ['./minio-init.sh:/init.sh:ro']
    entrypoint: ['/bin/sh', '/init.sh']
    restart: 'no'

  minio-test:
    image: loopkeeper-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: server
    profiles: ['test']
    environment:
      MINIO_ROOT_USER: loopkeeper-test-root
      MINIO_ROOT_PASSWORD: loopkeeper-test-root-secret
    command: server /data
    ports: ['9002:9000']
    volumes: [minio_test_data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-test-init:
    image: loopkeeper-mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: client
    profiles: ['test']
    depends_on:
      minio-test:
        condition: service_healthy
    environment:
      MINIO_URL: http://minio-test:9000
      MINIO_ROOT_USER: loopkeeper-test-root
      MINIO_ROOT_PASSWORD: loopkeeper-test-root-secret
      MINIO_BUCKET: loopkeeper-test
      MINIO_APP_USER: loopkeeper-test-app
      MINIO_APP_PASSWORD: loopkeeper-test-app-secret
    volumes: ['./minio-init.sh:/init.sh:ro']
    entrypoint: ['/bin/sh', '/init.sh']
    restart: 'no'

  migrate:
    build:
      context: ..
      target: builder
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loopkeeper}:${POSTGRES_PASSWORD:-loopkeeper}@postgres:5432/${POSTGRES_DB:-loopkeeper}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: ..
      target: production
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-loopkeeper}:${POSTGRES_PASSWORD:-loopkeeper}@postgres:5432/${POSTGRES_DB:-loopkeeper}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:?Set REFRESH_JWT_SECRET in .env}
      INVITATION_SECRET: ${INVITATION_SECRET:?Set INVITATION_SECRET in .env}
      REFRESH_JWT_EXPIRES_IN: ${REFRESH_JWT_EXPIRES_IN:-7d}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: loopkeeper
      S3_ACCESS_KEY_ID: loopkeeper-app
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD:-loopkeeper-app-dev-secret}
      S3_FORCE_PATH_STYLE: 'true'
      S3_KEY_PREFIX: ''
    depends_on:
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  postgres_test_data:
  minio_data:
  minio_test_data:
