name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'
  # Both Jest E2E and the Playwright API refuse any database other than loopkeeper_test.
  DATABASE_URL: postgresql://loopkeeper:loopkeeper@localhost:5434/loopkeeper_test
  LOOPKEEPER_TEST_DATABASE_URL: postgresql://loopkeeper:loopkeeper@localhost:5434/loopkeeper_test

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loopkeeper
          POSTGRES_PASSWORD: loopkeeper
          POSTGRES_DB: loopkeeper_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U loopkeeper -d loopkeeper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate && npx prisma validate
      - run: npx tsc --noEmit --incremental false -p tsconfig.json
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm test -- --runInBand
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loopkeeper
          POSTGRES_PASSWORD: loopkeeper
          POSTGRES_DB: loopkeeper_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U loopkeeper -d loopkeeper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # The browser suite starts the API from the repository root.
      - run: npm ci && npx prisma generate
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build && npm run typecheck:e2e
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
