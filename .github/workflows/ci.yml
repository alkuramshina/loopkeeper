name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.21.0'
  # Both Jest E2E and the Playwright API refuse any database other than loopkeeper_test.
  DATABASE_URL: postgresql://loopkeeper:loopkeeper@localhost:5434/loopkeeper_test
  LOOPKEEPER_TEST_DATABASE_URL: postgresql://loopkeeper:loopkeeper@localhost:5434/loopkeeper_test

jobs:
  production:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify deployment configuration rules
        run: node --test deploy/validate-environment.test.mjs
      - name: Build all production images
        run: node deploy/build-images.mjs
      - name: Verify isolated production stack
        run: node deploy/test-production.mjs
        env:
          SMOKE_KEEP: 'true'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify production browser over controlled TLS
        run: npx playwright test --config playwright.production.config.ts
        working-directory: frontend
        env:
          SMOKE_INTERNAL_TLS: 'true'
      - name: Sign into GHCR for trusted main commits only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified images and immutable manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node deploy/publish-images.mjs
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: deployment-${{ github.sha }}
          path: deployment/
          retention-days: 90

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loopkeeper
          POSTGRES_PASSWORD: loopkeeper
          POSTGRES_DB: loopkeeper_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U loopkeeper -d loopkeeper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Build pinned upstream MinIO sources; official images are unavailable.
      - name: Start isolated media storage
        run: |
          JWT_SECRET=ci-access-secret-long-enough REFRESH_JWT_SECRET=ci-refresh-secret-long-enough INVITATION_SECRET=ci-invitation-secret-long-enough docker compose --env-file .env.example -f deploy/docker-compose.yml --profile test up -d --wait minio-test
          JWT_SECRET=ci-access-secret-long-enough REFRESH_JWT_SECRET=ci-refresh-secret-long-enough INVITATION_SECRET=ci-invitation-secret-long-enough docker compose --env-file .env.example -f deploy/docker-compose.yml --profile test run --rm --no-deps minio-test-init
      - run: npm ci
      - run: npx prisma generate && npx prisma validate
      - run: npx tsc --noEmit --incremental false -p tsconfig.json
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm test -- --runInBand
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loopkeeper
          POSTGRES_PASSWORD: loopkeeper
          POSTGRES_DB: loopkeeper_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U loopkeeper -d loopkeeper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # The browser suite starts the API from the repository root.
      # Build pinned upstream MinIO sources; official images are unavailable.
      - name: Start isolated media storage
        run: |
          JWT_SECRET=ci-access-secret-long-enough REFRESH_JWT_SECRET=ci-refresh-secret-long-enough INVITATION_SECRET=ci-invitation-secret-long-enough docker compose --env-file .env.example -f deploy/docker-compose.yml --profile test up -d --wait minio-test
          JWT_SECRET=ci-access-secret-long-enough REFRESH_JWT_SECRET=ci-refresh-secret-long-enough INVITATION_SECRET=ci-invitation-secret-long-enough docker compose --env-file .env.example -f deploy/docker-compose.yml --profile test run --rm --no-deps minio-test-init
      - run: npm ci && npx prisma generate
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build && npm run typecheck:e2e
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
